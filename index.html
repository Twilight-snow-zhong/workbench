<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#eef3f6">
<meta name="robots" content="noindex, nofollow">
<title>我的工作台 · 学习与生活</title>
<style>
/* ==================================================================
   个人工作台 · 设计系统 v3
   气质参考 twilightsnowzhong.me：冷调纸感 / 轻字重 / 细线 / 大量留白
   主色：低饱和苔绿
   ================================================================== */
:root{
  /* 纸与墨 */
  --paper:#eef3f6;
  --paper-2:#e7eef2;
  --card:#ffffff;
  --ink:#1f3038;
  --ink-2:#3c515c;
  --muted:#7d919b;
  --muted-2:#a3b3bb;
  --line:#dde7ec;
  --line-2:#edf3f6;

  /* 主色：苔绿 */
  --g:#3c6b52;
  --g-d:#2e5540;
  --g-l:#6d9a80;
  --g-bg:#e7efe9;
  --g-bg2:#f2f7f3;

  /* 状态 */
  --warm:#b1623b;
  --warm-bg:#f8ece5;
  --gold:#9a7734;
  --gold-bg:#f7f1e3;
  --blue:#476b8a;
  --blue-bg:#e9eff5;
  --red:#a8443c;

  /* 尺度 */
  --r-lg:16px;
  --r:12px;
  --r-sm:8px;
  --sp:18px;
  --sh-1:0 1px 2px rgba(31,48,56,.035), 0 3px 14px rgba(31,48,56,.045);
  --sh-2:0 2px 6px rgba(31,48,56,.06), 0 14px 34px rgba(31,48,56,.09);
  --side-w:214px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",system-ui,-apple-system,sans-serif;
  color:var(--ink); font-size:14px; line-height:1.68;
  -webkit-font-smoothing:antialiased;
  background-color:var(--paper);
  background-image:
    radial-gradient(1100px 680px at 12% -12%, rgba(255,255,255,.62) 0%, rgba(255,255,255,0) 62%),
    linear-gradient(180deg, rgba(243,247,250,.84) 0%, rgba(230,238,243,.90) 100%),
    var(--scene, none);
  background-size:cover, cover, cover;
  background-position:center top, center top, center 54%;
  background-repeat:no-repeat;
  background-attachment:fixed;
}
/* 雾感噪点 */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:98;opacity:.13;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.78' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='.55'/></svg>");
}
img{display:block;max-width:100%}
button,input,select,textarea{font:inherit;color:inherit}
::selection{background:var(--g-bg);color:var(--g-d)}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(125,145,155,.28);border-radius:9px}
::-webkit-scrollbar-thumb:hover{background:rgba(125,145,155,.45)}
::-webkit-scrollbar-track{background:transparent}

/* ================= 骨架 ================= */
#app{display:flex;min-height:100vh;align-items:stretch}

/* ---- 侧栏 ---- */
#side{
  flex:0 0 var(--side-w);width:var(--side-w);position:sticky;top:0;height:100vh;
  overflow-y:auto;overscroll-behavior:contain;z-index:40;
  background:linear-gradient(180deg,rgba(255,255,255,.62),rgba(255,255,255,.30));
  border-right:1px solid var(--line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  padding:22px 12px 20px;
}
.brand{display:flex;align-items:center;gap:9px;padding:0 8px 22px}
.brand .mark{width:26px;height:26px;flex:0 0 26px;color:var(--g);opacity:.9}
.brand .bt{display:flex;flex-direction:column;line-height:1.25}
.brand b{font-size:14.5px;font-weight:600;letter-spacing:.3px;color:var(--ink)}
.brand small{font-size:8.5px;letter-spacing:1.5px;color:var(--muted-2);text-transform:uppercase;margin-top:2px}

.nav{display:flex;flex-direction:column;gap:1px}
.nav a{
  display:flex;align-items:center;gap:9px;padding:8px 11px;border-radius:9px;
  color:var(--ink-2);font-size:13.5px;text-decoration:none;cursor:pointer;
  transition:background .16s,color .16s;user-select:none;position:relative;
}
.nav a .ni{width:19px;flex:0 0 19px;display:flex;align-items:center;justify-content:center;font-size:13.5px;line-height:1;opacity:.8}
.nav a .ni svg{width:15px;height:15px;display:block}
.nav a.on .ni{opacity:1;color:var(--g)}
.nav a:hover{background:rgba(255,255,255,.72);color:var(--ink)}
.nav a.on{background:#fff;color:var(--g-d);font-weight:600;box-shadow:0 1px 3px rgba(31,48,56,.07)}
.nav a.on::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:2.5px;height:15px;border-radius:2px;background:var(--g)}

/* 「更多」折叠组：不常用的板块收在这里 */
.navmore{margin-top:3px}
.navtoggle{
  display:flex;align-items:center;gap:8px;width:100%;background:transparent;border:none;
  padding:8px 11px;border-radius:9px;color:var(--muted-2);font-size:12px;cursor:pointer;
  transition:.16s;text-align:left;letter-spacing:.2px
}
.navtoggle:hover{background:rgba(255,255,255,.62);color:var(--ink-2)}
.navtoggle .chev{width:12px;flex:0 0 12px;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.navmore.open .navtoggle .chev{transform:rotate(90deg)}
.navtoggle .nl{flex:1;white-space:nowrap}
.navtoggle em{
  font-style:normal;font-size:9.5px;color:var(--muted-2);background:var(--line-2);
  border-radius:20px;padding:1px 6px;line-height:1.5
}
.navsub{display:none;margin-top:1px}
.navmore.open .navsub{display:block}

.side-foot{margin-top:20px;padding:14px 8px 0;border-top:1px solid var(--line)}
.side-foot .tools{display:flex;gap:5px;margin-bottom:10px;flex-wrap:wrap}
.side-foot button{
  background:rgba(255,255,255,.7);border:1px solid var(--line);color:var(--ink-2);
  border-radius:7px;padding:4px 8px;font-size:11px;cursor:pointer;transition:.16s;
  white-space:nowrap;flex:0 0 auto
}
.side-foot button:hover{background:#fff;border-color:var(--muted-2);color:var(--ink)}
.side-foot .note{color:var(--muted-2);font-size:10.5px;line-height:1.6}

/* ---- 主区 ---- */
main{flex:1;min-width:0;padding:26px 34px 90px;display:flex;flex-direction:column;max-width:1240px}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:24px;flex-wrap:wrap}
.phead .kick{
  font-size:10.5px;letter-spacing:1.1px;color:var(--muted-2);text-transform:uppercase;
  display:flex;align-items:center;gap:7px;margin-bottom:7px
}
.phead .kick::before{content:"";width:16px;height:1px;background:var(--muted-2);opacity:.7}
.phead h1{margin:0;font-size:30px;font-weight:500;letter-spacing:-.4px;color:var(--ink);line-height:1.25}
.phead .sub{margin:7px 0 0;color:var(--muted);font-size:12.5px;letter-spacing:.1px}
.phead-r{display:flex;align-items:center;gap:9px;padding-bottom:3px}
.datebox{
  font-size:12px;color:var(--muted);white-space:nowrap;letter-spacing:.2px;
  padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.6)
}
.datebox b{color:var(--ink-2);font-weight:600;font-variant-numeric:tabular-nums}
.menubtn{
  display:none;align-items:center;justify-content:center;width:34px;height:34px;
  border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.8);
  font-size:15px;cursor:pointer;color:var(--ink-2)
}

/* ================= 网格 ================= */
.grid{display:grid;gap:var(--sp)}
.g2{grid-template-columns:1.32fr 1fr}
.g2e{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.col{display:flex;flex-direction:column;gap:var(--sp);min-width:0}
.mt{margin-top:var(--sp)}

/* ================= 卡片 ================= */
.card{
  background:var(--card);border-radius:var(--r-lg);padding:20px 22px;
  border:1px solid var(--line);box-shadow:var(--sh-1);min-width:0;
}
.card.flat{padding:16px 18px;border-radius:var(--r)}
.card-hd{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-hd h2{
  margin:0;font-size:14.5px;font-weight:600;color:var(--ink);letter-spacing:.1px;
  display:flex;align-items:center;gap:8px
}
.card-hd h2 .ci{font-size:12.5px;opacity:.55;filter:saturate(.7)}
.card-hd .more{
  color:var(--muted);font-size:11.5px;cursor:pointer;white-space:nowrap;transition:.16s;
  display:inline-flex;align-items:center;gap:3px
}
.card-hd .more:hover{color:var(--g)}
.sub{color:var(--muted);font-size:11.5px;margin:-9px 0 13px;line-height:1.6}

/* ================= 页首 hero ================= */
.hero{
  display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;
  padding:24px 26px;border-radius:var(--r-lg);border:1px solid var(--line);
  background:linear-gradient(120deg,#ffffff 0%,#f8fbf9 58%,#f2f7f3 100%);
  box-shadow:var(--sh-1);position:relative;overflow:hidden
}
.hero::after{
  content:"";position:absolute;right:-40px;top:-60px;width:240px;height:240px;border-radius:50%;
  background:radial-gradient(circle,rgba(60,107,82,.07),transparent 68%);pointer-events:none
}
.hero-main{min-width:0;flex:1}
.hero .kick{font-size:10.5px;letter-spacing:1.1px;color:var(--muted-2);text-transform:uppercase}
.hero h2{
  margin:9px 0 0;font-size:27px;font-weight:500;letter-spacing:-.3px;color:var(--ink);line-height:1.3
}
.hero p{margin:9px 0 0;color:var(--ink-2);font-size:13px;line-height:1.75}
.hero p b{color:var(--g-d);font-weight:600;font-variant-numeric:tabular-nums}
.hero p .warn b{color:var(--warm)}
.hero-side{display:flex;align-items:center;gap:18px;flex:0 0 auto}

/* ================= 统计行（极简） ================= */
.stats{display:grid;gap:12px}
.stat{
  background:rgba(255,255,255,.72);border:1px solid var(--line);border-radius:var(--r);
  padding:14px 16px;display:flex;align-items:center;gap:12px;transition:.16s
}
.stat:hover{background:#fff}
.stat .si{font-size:16px;opacity:.85;line-height:1}
.stat b{
  display:block;font-size:23px;font-weight:500;color:var(--ink);line-height:1.15;
  font-variant-numeric:tabular-nums;letter-spacing:-.3px
}
.stat span{display:block;font-size:10.5px;color:var(--muted);margin-top:2px;letter-spacing:.2px}
.stat.warn b{color:var(--warm)}

/* ================= 快速记录 ================= */
.qadd{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qadd input[type=text],.qadd input[type=number],.qadd input[type=date]{
  border:1px solid var(--line);border-radius:9px;padding:9px 13px;font-size:13px;
  outline:none;background:#fbfdfe;transition:.16s;min-width:0
}
.qadd input[type=text]{flex:1;min-width:170px}
.qadd input[type=number]{flex:0 0 92px}
.qadd input:focus{border-color:var(--g-l);background:#fff;box-shadow:0 0 0 3px rgba(60,107,82,.08)}
.qadd select{
  border:1px solid var(--line);border-radius:9px;padding:8px 9px;font-size:12.5px;
  background:#fbfdfe;outline:none;cursor:pointer;transition:.16s
}
.qadd select:focus{border-color:var(--g-l)}
.qadd .hint{width:100%;color:var(--muted-2);font-size:10.5px;letter-spacing:.2px}

/* ================= 按钮 ================= */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  border:1px solid var(--line);border-radius:9px;padding:8px 14px;font-size:12.5px;
  cursor:pointer;transition:.16s;background:#fff;color:var(--ink-2);text-decoration:none;
  white-space:nowrap;letter-spacing:.1px
}
.btn:hover{background:#fbfdfe;border-color:var(--muted-2);color:var(--ink)}
.btn:active{transform:translateY(.5px)}
.btn.p{background:var(--g);border-color:var(--g);color:#fff;font-weight:500}
.btn.p:hover{background:var(--g-d);border-color:var(--g-d);color:#fff}
.btn.g{background:var(--g-bg2);border-color:var(--g-bg);color:var(--g-d)}
.btn.g:hover{background:var(--g-bg);color:var(--g-d)}
.btn.o{background:transparent}
.btn.sm{padding:5px 10px;font-size:11.5px;border-radius:7px}
.btn.xs{padding:3px 8px;font-size:11px;border-radius:6px}
.btn.blk{width:100%}
.btn.danger{color:var(--red);border-color:#eed9d6}
.btn.danger:hover{background:#fdf3f2}

/* ================= 标签 / 胶囊 ================= */
.pill{
  display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;
  font-size:10.5px;background:var(--g-bg2);color:var(--g-d);white-space:nowrap;letter-spacing:.1px
}
.pill.line{background:transparent;border:1px solid var(--line);color:var(--muted)}
.cat{
  display:inline-flex;align-items:center;border-radius:5px;padding:1px 7px;font-size:10px;
  background:var(--line-2);color:var(--muted);white-space:nowrap;letter-spacing:.1px
}
.cat.学习{background:var(--blue-bg);color:var(--blue)}
.cat.生活{background:var(--g-bg);color:var(--g-d)}
.cat.社团{background:var(--gold-bg);color:var(--gold)}
.cat.健康{background:#f6ebef;color:#9c5b73}
.cat.钱,.cat.固定{background:#f5f0e6;color:#8a7334}

/* 截止日徽章 */
.dl{
  font-size:10.5px;border-radius:5px;padding:1px 7px;white-space:nowrap;
  font-variant-numeric:tabular-nums;letter-spacing:.1px;border:1px solid transparent
}
.dl.over{background:var(--warm-bg);color:var(--warm);font-weight:600}
.dl.today{background:var(--gold-bg);color:var(--gold);font-weight:600}
.dl.soon{background:var(--g-bg2);color:var(--g)}
.dl.ok{background:transparent;border-color:var(--line);color:var(--muted)}
.dl.none{color:var(--muted-2)}

/* ================= 待办行 ================= */
.tk{
  display:flex;align-items:center;gap:11px;padding:10px 6px;border-radius:9px;
  transition:background .14s;position:relative
}
.tk+.tk{border-top:1px solid var(--line-2)}
.tk:hover{background:#fbfdfe}
.tk.over{background:linear-gradient(90deg,var(--warm-bg),rgba(248,236,229,0) 72%)}
.tk.over:hover{background:linear-gradient(90deg,#f6e7df,rgba(246,231,223,0) 72%)}
.tk .tt{flex:1;min-width:0;cursor:pointer}
.tk .tt b{
  display:block;font-size:13px;font-weight:500;color:var(--ink);letter-spacing:.1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.tk.over .tt b{color:#8d4a2c}
.tk .tt small{
  display:block;color:var(--muted-2);font-size:10.5px;margin-top:1px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.tk.done .tt b{color:var(--muted-2);text-decoration:line-through;text-decoration-color:var(--line)}
.tk .tr{display:flex;align-items:center;gap:6px;flex:0 0 auto}

/* 勾选框 */
.sqc{
  width:18px;height:18px;border-radius:5px;border:1.5px solid #d3dfe4;background:#fff;
  cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;
  font-size:11px;transition:.16s;flex:0 0 auto
}
.sqc:hover{border-color:var(--g-l);background:var(--g-bg2)}
.sqc.on{background:var(--g);border-color:var(--g)}
.circ{
  width:19px;height:19px;border-radius:50%;border:1.5px solid #d3dfe4;background:#fff;
  cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;
  font-size:11px;transition:.16s;flex:0 0 auto
}
.circ:hover{border-color:var(--g-l)}
.circ.on{background:var(--g);border-color:var(--g)}

/* 行内操作：默认淡，悬停才明显 */
.tk .edt,.tk .del,.row .edt,.row .del{
  color:#c9d7dd;cursor:pointer;font-size:12px;padding:2px 4px;line-height:1;border-radius:5px;
  transition:.16s
}
.tk .edt:hover,.row .edt:hover{color:var(--g);background:var(--g-bg2)}
.tk .del:hover,.row .del:hover{color:var(--warm);background:var(--warm-bg)}

/* 分组标题 */
.gtitle{
  display:flex;align-items:center;gap:8px;font-size:11.5px;font-weight:600;
  color:var(--ink-2);margin:16px 0 4px;letter-spacing:.2px
}
.gtitle:first-child{margin-top:0}
.gtitle .dot{width:5px;height:5px;border-radius:50%;background:var(--muted-2);flex:0 0 5px}
.gtitle.red .dot{background:var(--warm)}
.gtitle.amber .dot{background:var(--gold)}
.gtitle.green .dot{background:var(--g)}
.gtitle .cnt{font-weight:400;color:var(--muted-2);font-size:10.5px;margin-left:6px}

/* ================= 通用列表行 ================= */
.rows{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:11px;padding:10px 6px;border-radius:9px;transition:.14s}
.row+.row{border-top:1px solid var(--line-2)}
.row:hover{background:#fbfdfe}
.row .rth{
  width:30px;height:30px;flex:0 0 30px;border-radius:8px;display:flex;align-items:center;
  justify-content:center;font-size:14px;background:var(--g-bg2);color:var(--g-d);overflow:hidden
}
.row .rth.rd{border-radius:50%}
.row .rm{flex:1;min-width:0}
.row .rm b{
  display:block;font-size:13px;font-weight:500;color:var(--ink);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap
}
.row .rm small{display:block;color:var(--muted-2);font-size:10.5px;margin-top:1px}
.row .rr{flex:0 0 auto;font-size:11px;color:var(--muted-2);text-align:right;font-variant-numeric:tabular-nums}

/* ================= 进度 ================= */
.prog{height:5px;background:var(--line-2);border-radius:5px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--g-l);border-radius:5px;transition:width .5s}
.progrow{display:flex;align-items:center;gap:10px}
.progrow .pv{font-size:11px;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}

/* ================= 圆环 ================= */
.ring{position:relative;display:inline-flex;align-items:center;justify-content:center}
.ring svg{transform:rotate(-90deg);display:block}
.ring .rc{fill:none;stroke-linecap:round}
.ring .rt{stroke:var(--line-2)}
.ring .rv{stroke:var(--g-l);transition:stroke-dashoffset .55s cubic-bezier(.3,1,.4,1)}
.ring .rin{position:absolute;text-align:center;line-height:1.2}
.ring .rin b{display:block;font-size:19px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.3px}
.ring .rin small{display:block;font-size:9.5px;color:var(--muted-2);margin-top:1px}

/* ================= 习惯 ================= */
.habits{display:flex;gap:6px;justify-content:space-between;flex-wrap:wrap}
.habit{
  display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;min-width:56px;
  cursor:pointer;padding:4px 0;border-radius:9px;transition:.16s
}
.habit:hover{background:#fbfdfe}
.habit .hb{position:relative;width:46px;height:46px}
.habit .hb .em{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px}
.habit .hl{font-size:10px;color:var(--muted);text-align:center;line-height:1.25}
.habit .hn{font-size:10px;color:var(--muted-2);font-variant-numeric:tabular-nums}
.habit.on .hl{color:var(--g-d);font-weight:600}

/* ================= 课表 ================= */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:start}
.wday{
  background:#fbfdfe;border:1px solid var(--line-2);border-radius:var(--r);padding:9px 8px;min-height:86px
}
.wday.today{background:#fff;border-color:#cfe2d6;box-shadow:0 2px 10px rgba(60,107,82,.07)}
.wday h4{
  margin:0 0 6px;font-size:11px;color:var(--ink-2);font-weight:600;
  display:flex;align-items:baseline;justify-content:space-between;gap:4px;letter-spacing:.2px
}
.wday h4 em{font-style:normal;font-size:9.5px;color:var(--muted-2);font-weight:400}
.wday .cls{
  margin-bottom:5px;border-radius:7px;padding:5px 7px;background:#fff;
  border-left:2.5px solid var(--c,var(--g));box-shadow:0 1px 2px rgba(31,48,56,.05);
  cursor:pointer;transition:.14s
}
.wday .cls:hover{box-shadow:0 2px 8px rgba(31,48,56,.09)}
.wday .cls b{display:block;font-size:10.5px;font-weight:600;color:var(--ink);line-height:1.4;word-break:break-word}
.wday .cls small{display:block;font-size:9px;color:var(--muted-2);margin-top:2px;line-height:1.45}
.wday .cls .pn{
  display:inline-block;background:var(--g-bg2);color:var(--g);border-radius:3px;
  padding:0 4px;font-size:8.5px;margin-right:3px;font-variant-numeric:tabular-nums
}
.wday .cls .cn{
  display:inline-block;border-radius:3px;padding:0 4px;font-size:8.5px;margin-left:3px;
  background:var(--gold-bg);color:var(--gold);font-weight:400;vertical-align:1px
}
.wday .cls.off{opacity:.42;border-left-color:var(--line);background:#fafcfd}
.wday .cls .offt{display:block;color:var(--muted-2);font-size:8.5px;margin-top:2px}
.wday .none{color:var(--muted-2);font-size:10px;padding:6px 2px}

/* ================= 记账 ================= */
.daygroup{border-bottom:1px solid var(--line-2);padding:6px 0 2px}
.daygroup .dhd{
  display:flex;align-items:baseline;gap:9px;padding:7px 6px 2px;
  font-size:10.5px;color:var(--muted);letter-spacing:.2px
}
.daygroup .dhd b{font-variant-numeric:tabular-nums;color:var(--muted-2);font-weight:400}
.mrow{display:flex;align-items:center;gap:10px;padding:7px 6px;border-radius:7px}
.mrow:hover{background:#fbfdfe}
.mrow .mt{flex:1;min-width:0;font-size:12.5px;color:var(--ink)}
.mrow .ma{
  flex:0 0 auto;font-size:12.5px;font-weight:600;color:var(--warm);
  font-variant-numeric:tabular-nums;letter-spacing:-.2px
}
.mrow.in .ma{color:var(--g)}
.catbar{display:flex;height:8px;border-radius:6px;overflow:hidden;background:var(--line-2)}
.catbar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:5px 12px;margin-top:12px;font-size:10.5px;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:7px;height:7px;border-radius:2px;display:block;flex:0 0 7px}

/* ================= 清单卡 ================= */
.pcard{
  background:#fbfdfe;border:1px solid var(--line-2);border-radius:var(--r);
  padding:15px 16px;display:flex;flex-direction:column
}
.pcard h4{
  margin:0 0 2px;font-size:13px;color:var(--ink);font-weight:600;display:flex;align-items:center;gap:7px
}
.pcard .psub{color:var(--muted-2);font-size:10.5px;margin-bottom:9px}
.pcard .pi{
  display:flex;align-items:center;gap:8px;padding:6px 4px;font-size:12.5px;color:var(--ink-2);
  cursor:pointer;border-radius:6px
}
.pcard .pi:hover{background:#f4f9f6}
.pcard .pi.done{color:var(--muted-2);text-decoration:line-through;text-decoration-color:var(--line)}
.pcard .pi .bx{
  width:16px;height:16px;flex:0 0 16px;border-radius:4px;border:1.5px solid #d3dfe4;
  display:flex;align-items:center;justify-content:center;color:#fff;font-size:10px;background:#fff
}
.pcard .pi.done .bx{background:var(--g);border-color:var(--g)}

/* ================= 课程卡 ================= */
.ccard{
  background:#fff;border:1px solid var(--line);border-radius:var(--r);
  padding:16px 17px;box-shadow:var(--sh-1)
}
.ccard .chd{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:6px}
.ccard .chd b{font-size:13.5px;color:var(--ink);font-weight:600;display:flex;align-items:center;gap:7px}
.ccard .cdot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:0 0 7px}
.ccard .meta{
  display:flex;flex-wrap:wrap;gap:3px 13px;color:var(--muted-2);font-size:10.5px;
  margin:5px 0 11px;line-height:1.6
}

/* ================= 目标 ================= */
.goal{background:#fbfdfe;border:1px solid var(--line-2);border-radius:var(--r);padding:14px 15px}
.goal .ghd{display:flex;align-items:center;justify-content:space-between;gap:9px}
.goal .ghd b{font-size:12.5px;color:var(--ink);font-weight:600}

/* ================= 书 ================= */
.book{
  border-radius:8px;aspect-ratio:3/4.2;max-width:104px;display:flex;align-items:center;
  justify-content:center;font-size:30px;text-align:center;
  box-shadow:0 2px 10px rgba(31,48,56,.12)
}
.quote{
  background:#fbfdfe;border-left:2px solid var(--g-bg);border-radius:0 8px 8px 0;
  padding:10px 13px;color:var(--ink-2);font-size:12px;line-height:1.75
}
.quote em{display:block;font-style:normal;color:var(--muted-2);font-size:10.5px;text-align:right;margin-top:4px}

/* 笔记块 */
.note{
  background:#fbfdfe;border:1px solid var(--line-2);border-radius:10px;padding:12px 14px;
  font-size:12px;color:var(--ink-2);line-height:1.75
}
.note small{display:block;color:var(--muted-2);font-size:10.5px;margin-top:6px}

/* ================= 图表 ================= */
.bars{display:flex;align-items:flex-end;gap:8px;height:132px;padding:4px 2px 0}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bar .bt{width:100%;max-width:34px;flex:1;background:var(--line-2);border-radius:5px;display:flex;align-items:flex-end;overflow:hidden}
.bar .bf{width:100%;background:var(--g-l);border-radius:5px;transition:height .5s cubic-bezier(.3,1,.4,1);min-height:2px}
.bar .bl{font-size:9.5px;color:var(--muted-2);text-align:center;line-height:1.35;white-space:nowrap}
.bar .bl i{display:block;font-style:normal;font-size:9px;color:var(--muted-2);opacity:.85}
.ylab{
  display:flex;flex-direction:column;justify-content:space-between;height:132px;
  font-size:9px;color:var(--muted-2);padding-bottom:24px;flex:0 0 20px;text-align:right
}
.chart-wrap{display:flex;gap:7px}
.chart-wrap .bars{flex:1;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:11px;margin-bottom:13px}
.kpi{display:flex;align-items:center;gap:9px}
.kpi .ki{
  width:26px;height:26px;border-radius:7px;background:var(--g-bg2);
  display:flex;align-items:center;justify-content:center;font-size:12px
}
.kpi b{display:block;font-size:15px;font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;line-height:1.2}
.kpi small{display:block;font-size:9.5px;color:var(--muted-2)}

/* ================= 分段控件 / 工具条 ================= */
.seg{display:inline-flex;background:var(--line-2);border-radius:7px;padding:2px}
.seg button{
  border:none;background:transparent;padding:4px 10px;border-radius:6px;font-size:11px;
  color:var(--muted);cursor:pointer;transition:.16s
}
.seg button.on{background:#fff;color:var(--g-d);font-weight:600;box-shadow:0 1px 3px rgba(31,48,56,.09)}

.toolbar{display:flex;gap:4px;align-items:center;flex-wrap:wrap;margin-bottom:13px}
.toolbar .tb{
  padding:5px 11px;border-radius:7px;font-size:12px;color:var(--muted);cursor:pointer;
  transition:.16s;background:transparent;border:1px solid transparent
}
.toolbar .tb:hover{background:rgba(255,255,255,.7);color:var(--ink-2)}
.toolbar .tb.on{background:#fff;border-color:var(--line);color:var(--g-d);font-weight:600}
.toolbar .grow{flex:1}
.toolbar input[type=search],.toolbar input[type=text]{
  border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-size:12px;
  outline:none;background:#fff;min-width:150px;transition:.16s
}
.toolbar input:focus{border-color:var(--g-l);box-shadow:0 0 0 3px rgba(60,107,82,.07)}

/* ================= 空状态 ================= */
.empty{
  color:var(--muted-2);font-size:11.5px;text-align:center;padding:22px 12px;line-height:1.8
}

/* ================= 换风景 ================= */
.sthumb{
  height:70px;border-radius:9px;border:1px solid var(--line);background-size:cover;
  background-position:center 54%;margin-bottom:6px;transition:.16s
}
.sthumb:hover{transform:translateY(-1px);box-shadow:0 4px 14px rgba(31,48,56,.12)}
.sthumb.on{border-color:var(--g);box-shadow:0 0 0 2px var(--g-bg)}

/* ================= 弹窗 ================= */
.modal{
  position:fixed;inset:0;background:rgba(24,42,52,.34);backdrop-filter:blur(3px);
  display:flex;align-items:center;justify-content:center;z-index:200;padding:20px
}
.modal .mbox{
  background:#fff;border-radius:16px;padding:22px 24px;width:min(430px,100%);
  box-shadow:0 24px 64px rgba(20,40,50,.26);max-height:86vh;overflow:auto
}
.modal h3{margin:0 0 16px;font-size:15px;font-weight:600;color:var(--ink);letter-spacing:.2px}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:13px}
.field label{font-size:11px;color:var(--muted);letter-spacing:.2px}
.field input,.field select,.field textarea{
  border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:12.5px;
  outline:none;background:#fbfdfe;width:100%;resize:vertical;transition:.16s
}
.field input:focus,.field select:focus,.field textarea:focus{
  border-color:var(--g-l);background:#fff;box-shadow:0 0 0 3px rgba(60,107,82,.07)
}
.field .fhint{font-size:10px;color:var(--muted-2);margin-top:2px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;padding-top:14px;border-top:1px solid var(--line-2)}

/* ================= 提示 ================= */
.toast{
  position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(10px);
  background:rgba(31,48,56,.94);color:#fff;font-size:12.5px;border-radius:10px;
  padding:9px 16px;z-index:300;opacity:0;transition:.26s;pointer-events:none;
  box-shadow:0 10px 28px rgba(20,40,50,.24);display:flex;align-items:center;gap:10px;
  max-width:88vw
}
.toast.on{opacity:1;transform:translateX(-50%)}
.toast .undo{
  color:#9fd0b4;cursor:pointer;pointer-events:auto;font-weight:600;white-space:nowrap
}
.toast .undo:hover{color:#c6e8d6}
.scrim{position:fixed;inset:0;background:rgba(24,42,52,.26);z-index:39;display:none}
.scrim.on{display:block}

/* ================= 栅格工具 ================= */
.gcq{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gq{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.gc4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.gc4b{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.gc5{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}
.gc6{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.gc6b{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.gc7{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}

/* ================= 记账汇总 ================= */
/* 近 6 个月细条 */
.mb6wrap{display:flex;align-items:flex-end;gap:14px;margin-top:16px;padding-top:14px;border-top:1px solid var(--line-2)}
.mb6t{font-size:10.5px;color:var(--muted-2);white-space:nowrap;padding-bottom:16px;letter-spacing:.2px;flex:0 0 auto}
.mb6{display:flex;gap:10px;flex:1;align-items:flex-end;min-width:0}
.mb6b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;border-radius:6px;padding:3px 0;transition:.15s;min-width:0}
.mb6b:hover{background:#f6faf8}
.mb6c{width:100%;height:44px;display:flex;align-items:flex-end;justify-content:center}
.mb6c i{display:block;width:100%;max-width:26px;border-radius:3px 3px 0 0;min-height:2px;transition:height .45s}
.mb6v{font-size:9px;color:var(--muted-2);font-variant-numeric:tabular-nums;white-space:nowrap;line-height:1.2;min-height:11px}
.mb6l{font-size:9.5px;color:var(--muted-2);white-space:nowrap}

/* 分类列表（两列，带环比） */
.catlist{display:grid;grid-template-columns:1fr 1fr;gap:0 30px;margin-top:13px}
.clrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line-2);font-size:11.5px;min-width:0}
.clrow i{width:7px;height:7px;border-radius:2px;flex:0 0 7px}
.cln{flex:1;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.clv{color:var(--ink);font-variant-numeric:tabular-nums;font-weight:500;min-width:56px;text-align:right}
.clp{color:var(--muted-2);font-variant-numeric:tabular-nums;width:34px;text-align:right}
.cd{width:48px;text-align:right;font-variant-numeric:tabular-nums;font-size:10.5px}

/* 常用 chips */
.qbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.qt{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;flex:0 0 auto}
.qchips{display:flex;flex-wrap:wrap;gap:6px;flex:1;min-width:200px;align-items:center}
.qhint{font-size:10.5px;color:var(--muted-2);white-space:nowrap}
.qempty{font-size:11px;color:var(--muted-2);line-height:1.7}
.qchip{
  display:inline-flex;align-items:center;border:1px solid var(--line);background:#fff;
  border-radius:8px;padding:5px 10px;font-size:11.5px;color:var(--ink-2);cursor:pointer;
  transition:.15s;white-space:nowrap;line-height:1.5
}
.qchip:hover{background:var(--g-bg2);border-color:var(--g-l);color:var(--g-d)}
.qchip b{font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;margin-left:4px}
.qchip:hover b{color:var(--g)}
.qchip.in b{color:var(--g)}
.qchip .qx{
  font-style:normal;font-size:10px;line-height:1;color:#c9d7dd;margin-left:6px;
  padding:2px 3px;border-radius:4px;transition:.15s;
  visibility:hidden;pointer-events:none
}
.qchip:hover .qx{visibility:visible;pointer-events:auto}
.qchip .qx:hover{color:var(--warm);background:var(--warm-bg)}

/* 年视图：大数 */
.ykpi{display:flex;gap:34px;flex-wrap:wrap;align-items:flex-end}
.ykpi>div>small{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.2px}
.ykpi>div>b{display:block;font-size:24px;font-weight:500;letter-spacing:-.5px;font-variant-numeric:tabular-nums;margin-top:2px;line-height:1.25}

/* 年视图：12 个月柱 + 预算虚线 */
.y12{display:flex;flex-direction:column;gap:7px}
.y12plot{position:relative;height:168px}
.y12bars{display:flex;gap:6px;height:100%;align-items:flex-end}
.y12bars .yb{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer;border-radius:5px 5px 0 0;min-width:0;transition:.15s}
.y12bars .yb:hover{background:rgba(60,107,82,.06)}
.y12bars .yb.empty{cursor:default;opacity:.6}
.y12bars .ybb{background:var(--g-l);border-radius:2px 2px 3px 3px;transition:height .5s}
.y12bars .ybo{background:var(--gold);border-radius:3px 3px 0 0;transition:height .5s}
.y12bars .yb.empty .ybb{background:var(--line)}
.ybud{position:absolute;left:0;right:0;border-top:1px dashed var(--gold);opacity:.55;pointer-events:none;z-index:2}
.ybud span{position:absolute;right:0;top:-15px;font-size:9px;color:var(--gold);letter-spacing:.2px}
.y12ax{display:flex;gap:6px}
.y12ax span{flex:1;text-align:center;font-size:9.5px;color:var(--muted-2);min-width:0}
.y12ax span.on{color:var(--g);font-weight:600}

/* 年视图：分类排行 */
.ycat{display:flex;align-items:center;gap:12px;padding:7px 0;font-size:11.5px}
.ycat+.ycat{border-top:1px solid var(--line-2)}
.ycn{flex:0 0 56px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ycb{flex:1;height:6px;background:var(--line-2);border-radius:6px;overflow:hidden;min-width:0}
.ycb i{display:block;height:100%;border-radius:6px;transition:width .5s}
.ycv{flex:0 0 78px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:500}
.ycp{flex:0 0 36px;text-align:right;color:var(--muted-2);font-variant-numeric:tabular-nums;font-size:10.5px}

/* 年视图：逐月账单 */
.m2{display:flex;align-items:center;gap:10px;padding:9px 7px;border-radius:7px;font-size:11.5px;cursor:pointer;transition:.14s}
.m2+.m2{border-top:1px solid var(--line-2)}
.m2:hover{background:#fbfdfe}
.m2m{flex:0 0 52px;color:var(--ink-2);font-variant-numeric:tabular-nums;font-weight:500}
.m2v{flex:0 0 78px;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink);font-weight:500}
.m2v.in{color:var(--g);font-weight:400}
.m2c{flex:0 0 46px;text-align:right;color:var(--muted-2);font-variant-numeric:tabular-nums}
.m2d{flex:1;text-align:right;color:var(--muted-2);font-variant-numeric:tabular-nums;font-size:10.5px;white-space:nowrap}
.m2a{flex:0 0 10px;text-align:right;color:var(--muted-2)}

/* ================= 响应式 ================= */
@media(max-width:1180px){
  .g2{grid-template-columns:1fr}
  .g4,.gc4{grid-template-columns:repeat(2,1fr)}
  .gc6b{grid-template-columns:repeat(3,1fr)}
  .wk{grid-template-columns:repeat(4,1fr)}
  .gc4b{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:920px){
  #side{
    position:fixed;left:0;top:0;transform:translateX(-104%);
    transition:transform .26s cubic-bezier(.3,1,.4,1);width:236px;flex-basis:236px;
    background:rgba(255,255,255,.96);box-shadow:14px 0 40px rgba(20,40,50,.12)
  }
  #side.open{transform:none}
  main{padding:16px 16px 70px;max-width:none}
  .menubtn{display:flex}
  .phead{align-items:flex-start;margin-bottom:16px}
  .phead h1{font-size:24px}
  .phead .sub{font-size:11.5px}
  .g2,.g2e,.g3,.g4{grid-template-columns:1fr}
  .card{padding:16px}
  .hero{padding:18px;gap:16px}
  .hero h2{font-size:21px;margin-top:6px}
  .hero .hero-main{flex:1 1 100%;padding-right:76px}
  .hero .hero-side{width:auto;flex:0 0 auto;position:absolute;right:16px;bottom:16px}
  .hero .hero-side .ring{width:52px!important;height:52px!important}
  .hero .hero-side .ring svg{width:52px!important;height:52px!important}
  .hero .hero-side .ring .rin b{font-size:13px!important}
  .hero .hero-side .ring .rin small{font-size:8px!important}
  .phead .sub{display:none}
  .tk .tt b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .wk{grid-template-columns:1fr 1fr}
  .gc4,.gc4b{grid-template-columns:repeat(2,1fr)}
  .gq,.gcq{grid-template-columns:repeat(2,1fr)}
  .gc5,.gc6,.gc6b{grid-template-columns:repeat(3,1fr)}
  .gc7{grid-template-columns:repeat(4,1fr)}
  .toolbar{flex-wrap:wrap;overflow-x:visible;padding-bottom:2px}
  .toolbar>*{flex:0 0 auto}
  .toolbar .grow{flex:1 0 0}
  .qadd input[type=text]{flex:1 1 100%}
  /* 触屏上没有 hover，行内操作常亮 */
  .tk .edt,.tk .del,.row .edt,.row .del{color:#b6c7cf}
  /* 记账汇总：手机上分类单列、柱子变矮 */
  .catlist{grid-template-columns:1fr;gap:0}
  .y12plot{height:132px}
  .ykpi{gap:22px}
  .ykpi>div>b{font-size:20px}
  .mb6wrap{margin-top:13px;padding-top:12px}
  .mb6{gap:5px}
  .mb6c{height:34px}
  .qchip .qx{visibility:visible;pointer-events:auto}
  .qhint{display:none}
  .m2m{flex:0 0 44px}
  .m2v{flex:0 0 62px}
  .m2c{flex:0 0 40px}
  .ycn{flex:0 0 46px}
  .ycv{flex:0 0 64px}
  .ycp{flex:0 0 30px}
  .ylab{display:none}
}
@media(max-width:520px){
  .phead h1{font-size:21px}
  .hero h2{font-size:20px}
  .gc4b{grid-template-columns:repeat(2,1fr);gap:12px}
  .book{max-width:none}
  .bars{height:110px}
  .ylab{height:110px;padding-bottom:26px}
  .stat b{font-size:20px}
}
@media print{
  body::after{display:none}#side{display:none}main{padding:0}
}

</style>

<body>
<div id="app">
  <aside id="side">
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">

/* ---------- 2. 日期工具（先定义，种子数据要用） ---------- */
function pad2(n){ return n < 10 ? '0' + n : '' + n; }
function dayKey(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function todayKey(){ return dayKey(new Date()); }
function off(n){ const d = new Date(); d.setDate(d.getDate() + n); return dayKey(d); }
const WEEK = ['周日','周一','周二','周三','周四','周五','周六'];
/* 课表 / 重复提醒用 1=周一 … 7=周日 */
function dayName(d){ return WEEK[d % 7]; }
function parseKey(k){ const p = String(k).split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function dateText(k){
  const p = k.split('-').map(Number), d = parseKey(k);
  return p[0] + '年' + p[1] + '月' + p[2] + '日  ' + WEEK[d.getDay()];
}
function mdText(k){ const p = String(k).split('-').map(Number); return p[1] + '月' + p[2] + '日'; }
function shiftDay(k, n){ const d = parseKey(k); d.setDate(d.getDate() + n); return dayKey(d); }
/* 与今天相差几天：正=还有几天，0=今天，负=已逾期 */
function diffDays(k){
  if (!k) return null;
  const a = parseKey(k).getTime(), b = parseKey(todayKey()).getTime();
  return Math.round((a - b) / 86400000);
}
function weekStart(){
  const d = new Date(), w = d.getDay() === 0 ? 7 : d.getDay();
  d.setDate(d.getDate() - (w - 1));
  return dayKey(d);
}

/* ---------- 教学周与单双周 ---------- */
const DEF_START = '2026-09-07';   // 第 1 周的周一（可在课表页修改）
function termStart(){
  return (DB && DB.term && DB.term.start) ? DB.term.start : DEF_START;
}
/* 某天是第几教学周（1 起，可能为 0 或负数 = 还没开学） */
function weekNo(k){
  const s = parseKey(termStart()).getTime(), b = parseKey(k || todayKey()).getTime();
  return Math.floor((b - s) / 604800000) + 1;
}
/* 这门课在第 w 周上不上 */
function inWeeks(item, w){
  if (!item.weeks || !item.weeks.length) return true;
  if (!item.weeks.some(r => w >= r[0] && w <= r[1])) return false;
  if (item.parity === 'odd'  && w % 2 === 0) return false;
  if (item.parity === 'even' && w % 2 !== 0) return false;
  return true;
}
function weeksText(item){
  if (!item.weeks || !item.weeks.length) return '全学期';
  const s = item.weeks.map(r => r[0] === r[1] ? (r[0] + ' 周') : (r[0] + '-' + r[1] + ' 周')).join('、');
  return s + (item.parity === 'odd' ? '（单周）' : (item.parity === 'even' ? '（双周）' : ''));
}
/* 第 N 周是单周还是双周 */
function parityText(w){ return w % 2 === 1 ? '单周' : '双周'; }
/* 某天、第 w 周的课（已按周次过滤） */
function classesOf(d, w){
  const s = DB.schedule.filter(x => x.d === d)[0];
  return ((s && s.items) || []).filter(c => inWeeks(c, w));
}
/* 某天全部课（不过滤周次，用于展示「本周不上」的灰条） */
function allClassesOf(d){
  const s = DB.schedule.filter(x => x.d === d)[0];
  return (s && s.items) || [];
}

function sceneCss(i){ return (SCENES[i] || SCENES[0]).css; }
function applyScene(i){
  const k = (i == null) ? 0 : ((i % SCENES.length) + SCENES.length) % SCENES.length;
  document.documentElement.style.setProperty('--scene', sceneCss(k));
  return k;
}

/* ==================================================================
   核心层：存储 / 历史 / 表单 / CRUD / 搜索排序 / 任务聚合 / 组件
   —— 13 个板块都长在这一层上，所以不用每个模块各写一套
   ================================================================== */

/* ---------------- 工具 ---------------- */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const num = n => (Math.round(Number(n || 0) * 100) / 100).toLocaleString('zh-CN');
const sign = n => (n >= 0 ? '+' : '');
function shuffle(a){ a = a.slice(); for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

/* ---------------- 1. 存储 ---------------- */
const LS = 'dwb.life.v2';
const HIST_KEY = 'dwb.hist.v2';
let DB = null;

function loadDB(){
  let raw = null;
  try { raw = localStorage.getItem(LS); } catch (e) {}
  if (raw){ try { const o = JSON.parse(raw); if (o && o.v === 2) return o; } catch (e) {} }
  const s = seedData();
  s.habitSeed.forEach((k, i) => {
    s.habitLog[k] = {};
    if (i < 6){ s.habits.forEach((h, hi) => { if ((i + hi) % 3 !== 0) s.habitLog[k][h.k] = h.goal; }); }
  });
  delete s.habitSeed;
  return s;
}
function saveDB(){ try { localStorage.setItem(LS, JSON.stringify(DB)); } catch (e) {} }
function uid(){ return Math.random().toString(36).slice(2, 9); }

/* ---------------- 2. 撤销 / 历史快照 ---------------- */
let UNDO = [];
const UNDO_MAX = 60;
function pushUndo(){ UNDO.push(JSON.stringify(DB)); if (UNDO.length > UNDO_MAX) UNDO.shift(); }
function hasUndo(){ return UNDO.length > 0; }
function undoLast(){
  if (!UNDO.length) return toast('没有可以撤销的操作');
  DB = JSON.parse(UNDO.pop());
  saveDB(); render(true); toast('已撤销');
}
/* 每日快照：最多留 7 天，用于「手滑了 / 想回到上周」 */
function histLoad(){ try { return JSON.parse(localStorage.getItem(HIST_KEY) || '{}'); } catch (e) { return {}; } }
function histSave(o){ try { localStorage.setItem(HIST_KEY, JSON.stringify(o)); } catch (e) {} }
function dailySnap(){
  const h = histLoad(), k = todayKey();
  if (h[k]) return;
  h[k] = JSON.stringify(DB);
  const keys = Object.keys(h).sort();
  while (keys.length > 7) delete h[keys.shift()];
  histSave(h);
}
function snapList(){ return Object.keys(histLoad()).sort().reverse(); }
function restoreSnap(k){
  const h = histLoad();
  if (!h[k]) return toast('没有这天的快照');
  pushUndo();
  try { DB = JSON.parse(h[k]); DB.v = 2; saveDB(); render(); toast('已回到 ' + mdText(k) + ' 的状态'); }
  catch (e) { toast('快照读取失败'); }
}

/* ---------------- 3. 提示条（带撤销） ---------------- */
let toastTimer = null;
function toast(msg, withUndo){
  let el = $('#toast');
  if (!el){ el = document.createElement('div'); el.id = 'toast'; el.className = 'toast'; document.body.appendChild(el); }
  el.innerHTML = esc(msg) + (withUndo ? '<span class="undo" data-act="undo">撤销</span>' : '');
  el.classList.add('on');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('on'), withUndo ? 5200 : 1900);
}

/* ---------------- 4. 弹窗基座 ---------------- */
function closeModal(){ const m = $('#modal'); if (m) m.remove(); }
function modal(title, bodyHTML, onOk, okText, opt){
  closeModal();
  opt = opt || {};
  const w = document.createElement('div');
  w.className = 'modal'; w.id = 'modal';
  w.innerHTML = '<div class="mbox"><h3>' + esc(title) + '</h3>' + bodyHTML +
    '<div class="mfoot">' + (opt.onlyOk ? '' : '<button class="btn o" data-m="cancel">取消</button>') +
    '<button class="btn ' + (opt.danger ? 'danger' : 'p') + '" data-m="ok">' + esc(okText || '确定') + '</button></div></div>';
  document.body.appendChild(w);
  w.addEventListener('click', function(e){
    const t = e.target.closest('[data-m]');
    if (!t){ if (e.target === w) closeModal(); return; }
    if (t.getAttribute('data-m') === 'cancel') return closeModal();
    if (onOk && onOk(w) === false) return;
    closeModal();
  });
  w.addEventListener('keydown', function(e){
    if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA'){
      e.preventDefault();
      const okBtn = w.querySelector('[data-m="ok"]');
      if (okBtn) okBtn.click();
    }
  });
  const f = w.querySelector('input,textarea,select');
  if (f) setTimeout(() => { f.focus(); if (f.select) try { f.select(); } catch (e) {} }, 70);
  return w;
}
function confirmBox(msg, onYes, okText){
  return modal('确认', '<div style="font-size:12.5px;color:var(--ink-2);line-height:1.8">' + msg + '</div>',
    () => { onYes(); return true; }, okText || '确定', { danger: true });
}

/* ---------------- 5. 表单构造器 ----------------
   spec: [{k,label,type,value,opts,ph,hint,min,max,step,rows,required}]
   type: text | number | date | select | textarea | check
------------------------------------------------ */
function form(title, spec, onSave, opt){
  opt = opt || {};
  const body = spec.map(f => {
    const id = 'f_' + f.k;
    let input;
    if (f.type === 'select'){
      input = '<select id="' + id + '">' + (f.opts || []).map(o => {
        const v = (o && o.v !== undefined) ? o.v : o;
        const t = (o && o.t !== undefined) ? o.t : o;
        return '<option value="' + esc(v) + '"' + (String(f.value) === String(v) ? ' selected' : '') + '>' + esc(t) + '</option>';
      }).join('') + '</select>';
    } else if (f.type === 'textarea'){
      input = '<textarea id="' + id + '" rows="' + (f.rows || 4) + '" placeholder="' + esc(f.ph || '') + '">' + esc(f.value || '') + '</textarea>';
    } else if (f.type === 'check'){
      input = '<label style="display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);cursor:pointer">' +
        '<input type="checkbox" id="' + id + '" style="width:auto"' + (f.value ? ' checked' : '') + '> ' + esc(f.ph || '') + '</label>';
    } else {
      input = '<input type="' + (f.type || 'text') + '" id="' + id + '" value="' + esc(f.value == null ? '' : f.value) + '"' +

function repeatToday(){
  const d = new Date(), wd = d.getDay() === 0 ? 7 : d.getDay(), dd = d.getDate();
  return DB.repeat.filter(r => r.paused ? false : (r.freq === 'weekly' ? r.day === wd : r.day === dd))
    .map(r => ({
      key:'r:' + r.id, src:'repeat', ref:r.id, t:r.t, due: todayKey(), p:'m',
      cat:'固定', done: r.last === todayKey(), sub: r.note || '', fixed:false
    }));
}
function buckets(){
  const list = allTasks().concat(repeatToday());
  const b = {over:[], today:[], soon:[], later:[], done:[]};
  list.forEach(x => {
    if (x.done) return b.done.push(x);
    const n = diffDays(x.due);
    if (n === null || n > 7) b.later.push(x);
    else if (n < 0) b.over.push(x);
    else if (n === 0) b.today.push(x);
    else b.soon.push(x);
  });
  const byDue = (a, c) => (a.due || '9999').localeCompare(c.due || '9999');
  b.over.sort(byDue); b.today.sort(byDue); b.soon.sort(byDue); b.later.sort(byDue);
  return b;
}

function setDone(x){

  if (x.src === 'inbox'){ const o = DB.inbox.filter(v => v.id === x.ref)[0]; if (o){ o.done = !o.done; o.doneAt = o.done ? now : ''; } }
  else if (x.src === 'course'){ const o = (DB.courses[x.ci].tasks || []).filter(v => v.id === x.ref)[0]; if (o){ o.done = !o.done; o.doneAt = o.done ? now : ''; } }

  commit();
}

/* 节次显示：既支持「1-2 节」，也支持直接写时间「15:00-16:00」 */
function pTxt(p){

}
/* 节次排序键：把节次和时间都换算成"当天第几分钟"，混排也正确 */
function pMin(p){
  const s = String(p || '');
  const m = s.match(/^(\d{1,2})\s*[:：]\s*(\d{2})/);
  if (m) return Number(m[1]) * 60 + Number(m[2]);
  const n = parseInt(s, 10);
  if (isNaN(n)) return 0;
  if (n <= 4) return 8 * 60 + (n - 1) * 50;      /* 上午 1-4 节 */
  if (n <= 8) return 14 * 60 + (n - 5) * 50;     /* 下午 5-8 节 */
  return 19 * 60 + (n - 9) * 50;                 /* 晚上 9-11 节 */
}

  if (n === 0) return '<span class="dl today">今天到期</span>';
  if (n === 1) return '<span class="dl soon">明天</span>';
  if (n <= 7)  return '<span class="dl soon">' + n + ' 天后</span>';

function ring(pct, size, stroke, inner, color){
  size = size || 92; stroke = stroke || 7;
  pct = clamp(Math.round(pct), 0, 100);
  const r = (size - stroke) / 2, c = 2 * Math.PI * r, off = c * (1 - pct / 100);
  const col = color ? ' style="stroke:' + color + '"' : '';
  return '<div class="ring" style="width:' + size + 'px;height:' + size + 'px">' +
    '<svg width="' + size + '" height="' + size + '">' +
      '<circle class="rc rt" cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" stroke-width="' + stroke + '"/>' +
      '<circle class="rc rv" cx="' + size/2 + '" cy="' + size/2 + '" r="' + r + '" stroke-width="' + stroke +
        '" stroke-dasharray="' + c.toFixed(1) + '" stroke-dashoffset="' + off.toFixed(1) + '"' + col + '/>' +
    '</svg>' +
    (inner === false ? '' : '<div class="rin">' + (inner || ('<b>' + pct + '%</b>')) + '</div>') +
  '</div>';
}
function bars(data, labels, unit){
  const max = Math.max.apply(null, data.concat([1]));
  return '<div class="chart-wrap"><div class="ylab"><span>' + max + '</span><span>' + Math.round(max/2) + '</span><span>0</span></div>' +
    '<div class="bars">' + data.map(function(v, i){
      const h = Math.max(2, Math.round(v / max * 100));
      return '<div class="bar"><div class="bt"><div class="bf" style="height:' + h + '%"></div></div>' +
        '<div class="bl">' + esc(labels[i] || '') + (v != null ? '<i>' + v + (unit || '') + '</i>' : '') + '</div></div>';
    }).join('') + '</div></div>';
}
function lineChart(series, labels){
  const W = 700, H = 140, PAD = 12, n = labels.length;
  const all = series.reduce((a, s) => a.concat(s.data), []);
  const max = Math.max.apply(null, all.concat([1])) * 1.18;
  const X = i => PAD + (n <= 1 ? (W - 2 * PAD) / 2 : i / (n - 1) * (W - 2 * PAD));
  const Y = v => H - PAD - (v / max) * (H - 2 * PAD);
  const paths = series.map(function(s, si){
    const pts = s.data.map((v, i) => [X(i), Y(v)]);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
    const area = d + ' L' + X(n-1).toFixed(1) + ' ' + (H-PAD) + ' L' + X(0).toFixed(1) + ' ' + (H-PAD) + ' Z';
    const col = si === 0 ? '#3c6b52' : '#a3c4b1';
    return '<path d="' + area + '" fill="' + col + '" opacity="' + (si===0?'.07':'.05') + '"/>' +
      '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>' +
      pts.map(p => '<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="4.2" fill="#fff" stroke="'+col+'" stroke-width="2.2"/>').join('');
  }).join('');
  return '<div><svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block;overflow:visible">' + paths + '</svg>' +
    '<div style="display:flex;justify-content:space-between;font-size:10px;color:var(--muted-2);margin-top:7px;padding:0 ' + PAD + 'px">' +
      labels.map(l => '<span>' + esc(l) + '</span>').join('') + '</div></div>';
}

function habitDoneCount(k){ const h = habitOf(k); return DB.habits.filter(x => (h[x.k] || 0) >= x.goal).length; }
function todayClasses(){
  const wd = new Date().getDay() === 0 ? 7 : new Date().getDay();
  return classesOf(wd, weekNo(todayKey()));
}
function weeksToStr(weeks){ return (weeks || []).map(r => r[0] === r[1] ? String(r[0]) : (r[0] + '-' + r[1])).join(','); }
function parseWeeks(s){
  return String(s || '').split(/[,，;；\s]+/).filter(Boolean).map(seg => {
    const m = seg.replace(/周/g, '').split('-').map(Number).filter(n => !isNaN(n));
    if (!m.length) return null;
    return [m[0], m.length > 1 ? m[1] : m[0]];
  }).filter(Boolean);
}
const CLS_COLORS = ['#5aa46b','#4f83cc','#a98ee0','#c98341','#c2587a','#3fa9a0','#8ba093'];

      ${b.over.length ? '<div class="gtitle red"><i class="dot"></i>已经逾期<span class="cnt">' + b.over.length + '</span></div>' + taskList(b.over) : ''}

      ${b.today.length ? (b.over.length ? taskList(b.today) : '<div class="gtitle amber"><i class="dot"></i>今天到期<span class="cnt">' + b.today.length + '</span></div>' + taskList(b.today)) : ''}
      ${!b.over.length && !b.today.length ? '<div class="empty">今天没有到期的事<br>要记点什么吗？</div>' : ''}
    </div>

    <div class="col">
      <div class="card">

function dueFromSel(v){
  if (v === '') return '';
  if (v === '-1'){ const d = new Date(), wd = d.getDay() === 0 ? 7 : d.getDay(); d.setDate(d.getDate() + (6 - wd)); return dayKey(d); }

}

/* ============================================================
   2. 待办收集箱
   ============================================================ */
V.inbox = function(){
  const b = buckets();
  const cat = STATE.q.inCat || '全部';
  const sort = STATE.q.inSort || 'due';
  const cats = ['全部','学习','生活','社团','健康','其他'];
  const sorter = arr => {
    const a = arr.slice();
    if (sort === 'prio') a.sort((x, y) => ({h:0,m:1,l:2}[x.p] - {h:0,m:1,l:2}[y.p]) || (x.due || '9999').localeCompare(y.due || '9999'));
    else if (sort === 'due') a.sort((x, y) => (x.due || '9999').localeCompare(y.due || '9999'));
    return a;
  };
  const pick = l => sorter(l.filter(x => (cat === '全部' || x.cat === cat) && hit(x.t + ' ' + x.cat + ' ' + x.sub, 'inQ')));
  const doneInbox = b.done.filter(x => x.src === 'inbox' && hit(x.t, 'inQ'));
  const grp = (title, cls, list) => list.length
    ? '<div class="gtitle ' + cls + '"><i class="dot"></i>' + title + '<span class="cnt">' + list.length + '</span></div>' + taskList(list)
    : '';
  const total = b.over.length + b.today.length + b.soon.length + b.later.length;

  return `
  <div class="card flat">
    <div class="card-hd" style="margin-bottom:10px"><h2><span class="ci">✍️</span>记一件事</h2>
      <span class="more">想到就丢进来</span></div>
    ${quickAdd()}
  </div>

  <div class="card mt">
    <div class="card-hd"><h2><span class="ci">📋</span>待办清单</h2>
      <span class="more">${total} 件未完成</span></div>
    <div class="toolbar">
      ${cats.map(c => '<button class="tb ' + (c === cat ? 'on' : '') + '" data-act="inbox.cat" data-k="' + c + '">' + c + '</button>').join('')}
      <span class="grow"></span>
      ${fSearch('inQ', '搜待办…')}
      <select data-sel="inSort" style="border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:11.5px;background:#fff;outline:none">
        <option value="due"${sort==='due'?' selected':''}>按截止日</option>
        <option value="prio"${sort==='prio'?' selected':''}>按优先级</option>
      </select>
    </div>
    ${grp('已经逾期','red',pick(b.over))}
    ${grp('今天到期','amber',pick(b.today))}
    ${grp('7 天内','green',pick(b.soon))}
    ${grp('以后再说','',pick(b.later))}
    ${grp('已完成','green',sorter(doneInbox))}
    ${doneInbox.length ? '<div style="text-align:right;margin-top:8px"><button class="btn sm o" data-act="inbox.clearDone">清空已完成</button></div>' : ''}
    ${total === 0 && !doneInbox.length ? '<div class="empty">清单是空的<br>想到什么先记下来</div>' : ''}
  </div>`;
};

/* ============================================================
   4. 课程与作业
   ============================================================ */
V.courses = function(){
  let open = 0, over = 0;
  DB.courses.forEach(c => (c.tasks || []).forEach(t => {
    if (t.done) return;
    open++;
    const n = diffDays(t.due);
    if (n !== null && n < 0) over++;
  }));
  const q = STATE.q.coQ || '';
  const list = DB.courses.filter(c => hit(c.name + ' ' + (c.teacher || ''), 'coQ'));

  return `
  <div class="toolbar">
    <span style="font-size:11.5px;color:var(--muted)">${DB.courses.length} 门课 · ${open} 项待做${over ? ' · <b style="color:var(--warm)">' + over + ' 项逾期</b>' : ''}</span>
    <span class="grow"></span>
    ${fSearch('coQ', '搜课程…')}
    <button class="btn sm p" data-act="co.addCourse">＋ 新增课程</button>
  </div>

  <div class="grid g2e">
    ${list.map((c, ci) => {
      const real = DB.courses.indexOf(c);
      const undone = (c.tasks || []).filter(t => !t.done).length;
      const all = (c.tasks || []).length;
      return '<div class="ccard">' +
        '<div class="chd"><b><span class="cdot" style="background:' + c.c + '"></span>' + esc(c.name) + '</b>' +
          '<div style="display:flex;gap:4px;align-items:center">' +
            (all ? '<span class="cat">' + (all - undone) + '/' + all + '</span>' : '') +
            '<span class="edt" data-act="co.editCourse" data-ci="' + real + '" title="改课程">✎</span>' +
            '<span class="del" data-act="co.delCourse" data-ci="' + real + '" title="删课程">✕</span>' +
          '</div></div>' +
        '<div class="meta">' +
          (c.teacher ? '<span>👤 ' + esc(c.teacher) + '</span>' : '') +
          (c.room ? '<span>📍 ' + esc(c.room) + '</span>' : '') +
          (c.when ? '<span>🕐 ' + esc(c.when) + '</span>' : '') +
          (c.weeks ? '<span>📆 ' + esc(c.weeks) + '</span>' : '') +
        '</div>' +
        '<div class="prog" style="margin-bottom:10px"><i style="width:' + (all ? Math.round((all - undone) / all * 100) : 0) + '%"></i></div>' +
        ((c.tasks || []).length
          ? taskList(c.tasks.map(t => ({key:'c:' + t.id, src:'course', ref:t.id, ci:real, t:t.t, due:t.due, p:'h', cat:c.name, done:!!t.done, sub:''})), {edit:'tk.edit', del:'co.del'})
          : '<div class="empty" style="padding:12px 0">还没有作业</div>') +
        '<button class="btn g blk" style="margin-top:9px" data-act="co.add" data-ci="' + real + '">＋ 加一项作业</button>' +
      '</div>';
    }).join('') || '<div class="card"><div class="empty">没有匹配的课程</div></div>'}
  </div>`;
};

  const gs = DB.goals.filter(g => !g.archived).sort((a, b) => String(a.due).localeCompare(String(b.due)));

  const exams = DB.events.filter(e => e.type === '考试').sort((a, b) => String(a.date).localeCompare(String(b.date)));
  const pool = gs.concat(exams.map(e => ({t:e.t, due:e.date, isExam:true})))
    .filter(x => diffDays(x.due) >= 0).sort((a, b) => String(a.due).localeCompare(String(b.due)));
  const near = pool[0];
  const nDays = near ? diffDays(near.due) : null;

  return `
  ${near ? `

    <div class="hero-main">
      <div class="kick">离最近的一件大事</div>
      <h2 style="display:flex;align-items:baseline;gap:10px">
        <span style="font-size:44px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:-2px">${nDays}</span>
        <span style="font-size:15px;font-weight:400;color:var(--muted)">天</span>
      </h2>

};

/* ==================================================================
   板块 7-9：生活费记账 / 购物与待买 / 习惯打卡
   ================================================================== */
const MC = {'吃饭':'#5f9a72','交通':'#5b82a8','学习':'#8f7fb8','日用':'#b58a52','娱乐':'#b96b8b','话费':'#4f9a95','水电费':'#7a93a8','医疗':'#9a6f8a','人情':'#c19a5c','其他':'#93a3ab'};

/* ============================================================
   7. 生活费记账（月 / 年 两级汇总）
   ============================================================ */

/* 月度统计：实时从 records 算，不新增任何存储字段 */
function mStats(mk){
  const recs = (DB.money.records || []).filter(r => String(r.d).slice(0, 7) === mk);
  const spend = recs.filter(r => !r.in).reduce((a, r) => a + Number(r.amt || 0), 0);
  const income = recs.filter(r => r.in).reduce((a, r) => a + Number(r.amt || 0), 0);
  const byCat = {};
  recs.filter(r => !r.in).forEach(r => { byCat[r.cat] = (byCat[r.cat] || 0) + Number(r.amt || 0); });
  return { mk, recs, spend, income, net: income - spend, count: recs.length, byCat };
}
/* 年度统计：固定 12 个月，跨年不串月 */
function yStats(yk){
  const months = [];
  for (let i = 1; i <= 12; i++) months.push(mStats(yk + '-' + pad2(i)));
  const spend = months.reduce((a, m) => a + m.spend, 0);
  const income = months.reduce((a, m) => a + m.income, 0);
  const byCat = {};
  months.forEach(m => Object.keys(m.byCat).forEach(c => { byCat[c] = (byCat[c] || 0) + m.byCat[c]; }));
  return { yk, months, spend, income, net: income - spend, byCat, active: months.filter(m => m.count > 0) };
}
/* 环比文案 */
function deltaText(cur, prev){
  if (!prev) return '<span style="color:var(--muted-2)">上月没有记录，没法比</span>';
  const d = cur - prev, pct = Math.round(d / prev * 100);
  if (!d) return '<span style="color:var(--muted-2)">和上月持平</span>';
  const up = d > 0;
  return '<span style="color:' + (up ? 'var(--warm)' : 'var(--g)') + '">' +
    (up ? '↑' : '↓') + ' 比上月' + (up ? '多' : '少') + ' ¥' + num(Math.abs(d)) +
    '（' + (up ? '+' : '') + pct + '%）</span>';
}

V.money = function(){
  const mk = STATE.q.mk || monthKey();
  return (STATE.q.mv === 'year') ? moneyYear(mk.slice(0, 4)) : moneyMonth(mk);
};

function moneyMonth(mk){
  const st = mStats(mk);
  const prev = mStats(shiftMonth(mk, -1));
  const recs = st.recs, spent = st.spend, income = st.income;
  const spendCnt = recs.filter(r => !r.in).length;
  /* 近 6 个月细条 */
  const band = [];
  for (let i = 5; i >= 0; i--) band.push(mStats(shiftMonth(mk, -i)));
  const bandMax = Math.max.apply(null, band.map(m => m.spend).concat([1]));
  const budget = DB.money.budget, left = budget - spent;
  const pct = clamp(Math.round(spent / Math.max(budget, 1) * 100), 0, 100);
  const isNow = mk === monthKey();
  const p = mk.split('-').map(Number);
  const dim = new Date(p[0], p[1], 0).getDate();
  const daysLeft = isNow ? Math.max(dim - new Date().getDate() + 1, 1) : dim;
  const perDay = left / daysLeft;
  const ringColor = pct >= 100 ? 'var(--warm)' : (pct >= 80 ? 'var(--gold)' : 'var(--g-l)');

  const byCat = {};
  recs.filter(r => !r.in).forEach(r => { byCat[r.cat] = (byCat[r.cat] || 0) + Number(r.amt || 0); });
  const cats = Object.keys(byCat).sort((a, b) => byCat[b] - byCat[a]);

  /* 按天分组 */
  const byDay = {};
  recs.forEach(r => { (byDay[r.d] = byDay[r.d] || []).push(r); });
  const days = Object.keys(byDay).sort().reverse();

  const quick = DB.money.quick || [];
  return `
  <div class="toolbar">
    <button class="btn sm o" data-act="mk.shift" data-v="-1">‹</button>
    <b style="font-size:13px;font-weight:600;margin:0 4px">${monthLabel(mk)}</b>
    <button class="btn sm o" data-act="mk.shift" data-v="1">›</button>
    ${isNow ? '' : '<button class="btn sm g" data-act="mk.now">回到本月</button>'}
    <span class="grow"></span>
    ${seg('mv', [{v:'month', t:'月'}, {v:'year', t:'年'}], 'month')}
    <button class="btn sm o" data-act="mo.budget">预算 ${num(budget)}</button>
    <button class="btn sm p" data-act="mo.add">＋ 记一笔</button>
  </div>

  <div class="card">
    <div style="display:flex;align-items:center;gap:26px;flex-wrap:wrap">
      <div style="flex:0 0 auto">
        ${ring(pct, 104, 8, '<b style="font-size:17px">¥' + num(spent) + '</b><small>已花 / 预算 ' + num(budget) + '</small>', ringColor)}
      </div>
      <div style="flex:1;min-width:230px">
        <div style="display:flex;gap:26px;flex-wrap:wrap">
          <div><div style="font-size:10.5px;color:var(--muted);letter-spacing:.2px">还剩</div>
            <div style="font-size:22px;font-weight:500;letter-spacing:-.4px;font-variant-numeric:tabular-nums;color:${left < 0 ? 'var(--warm)' : 'var(--ink)'}">¥${num(left)}</div></div>
          <div><div style="font-size:10.5px;color:var(--muted);letter-spacing:.2px">${isNow ? '本月还剩' : '这个月共'}</div>
            <div style="font-size:22px;font-weight:500;letter-spacing:-.4px;font-variant-numeric:tabular-nums">${daysLeft} 天</div></div>
          <div><div style="font-size:10.5px;color:var(--muted);letter-spacing:.2px">${isNow ? '平均每天能花' : '平均每天'}</div>
            <div style="font-size:22px;font-weight:500;letter-spacing:-.4px;font-variant-numeric:tabular-nums">¥${num(perDay)}</div></div>
          ${income ? '<div><div style="font-size:10.5px;color:var(--muted);letter-spacing:.2px">本月收入</div><div style="font-size:22px;font-weight:500;letter-spacing:-.4px;font-variant-numeric:tabular-nums;color:var(--g)">+¥' + num(income) + '</div></div>' : ''}
        </div>
        <div style="margin-top:10px;font-size:11.5px;color:${pct >= 80 ? (pct >= 100 ? 'var(--warm)' : 'var(--gold)') : 'var(--muted)'}">
          ${pct >= 100 ? '⚠️ 已经超出预算 ¥' + num(-left) : (pct >= 80 ? '⚠️ 快到预算线了（已用 ' + pct + '%）' : '已用 ' + pct + '%')}
        </div>
        <div style="margin-top:5px;font-size:11.5px">${deltaText(spent, prev.spend)}</div>
        <div style="margin-top:8px;display:flex;gap:18px;flex-wrap:wrap;font-size:11px;color:var(--muted-2)">
          <span>收入 <b style="color:var(--g);font-weight:500">¥${num(income)}</b></span>
          <span>结余 <b style="font-weight:500;color:${(income - spent) < 0 ? 'var(--warm)' : 'var(--ink-2)'}">${(income - spent) < 0 ? '-' : ''}¥${num(Math.abs(income - spent))}</b></span>
          <span>${st.count} 笔</span>
        </div>
      </div>
    </div>
    <div class="mb6wrap">
      <span class="mb6t">近 6 个月</span>
      <div class="mb6">
        ${band.map(m => {
          const h = Math.max(4, Math.round(m.spend / bandMax * 100));
          const over = budget && m.spend > budget;
          const curm = m.mk === mk;
          return '<div class="mb6b" data-act="mk.goto" data-mk="' + m.mk + '" title="' + esc(monthLabel(m.mk)) + ' · ¥' + num(m.spend) + '">' +
            '<div class="mb6c"><i style="height:' + h + '%;background:' + (over ? 'var(--gold)' : (curm ? 'var(--g)' : 'var(--g-l)')) + '"></i></div>' +
            '<div class="mb6v">' + (m.spend ? num(m.spend) : '·') + '</div>' +
            '<div class="mb6l" style="' + (curm ? 'color:var(--g);font-weight:600' : '') + '">' + Number(m.mk.slice(5)) + '月</div>' +
          '</div>';
        }).join('')}
      </div>
    </div>
  </div>

  <div class="card mt">
    <div class="card-hd"><h2><span class="ci">📊</span>花在哪了</h2><span class="more">${spendCnt} 笔 · 右边是比上月</span></div>
    <div class="catbar">${cats.length ? cats.map(c => '<i style="width:' + (byCat[c] / Math.max(spent, 1) * 100).toFixed(1) + '%;background:' + (MC[c] || '#93a3ab') + '"></i>').join('') : '<i style="width:100%"></i>'}</div>
    <div class="catlist">
      ${cats.length ? cats.map(c => {
        const v = byCat[c], share = Math.round(v / Math.max(spent, 1) * 100);
        const pv = prev.byCat[c] || 0;
        let d;
        if (!pv) d = '<span class="cd" style="color:var(--gold)">新增</span>';
        else {
          const dd = v - pv, pc = Math.round(dd / pv * 100);
          d = dd > 0 ? '<span class="cd" style="color:var(--warm)">↑' + pc + '%</span>'
            : dd < 0 ? '<span class="cd" style="color:var(--g)">↓' + Math.abs(pc) + '%</span>'
            : '<span class="cd" style="color:var(--muted-2)">持平</span>';
        }
        return '<div class="clrow">' +
          '<i style="background:' + (MC[c] || '#93a3ab') + '"></i>' +
          '<span class="cln">' + esc(c) + '</span>' +
          '<span class="clv">¥' + num(v) + '</span>' +
          '<span class="clp">' + share + '%</span>' + d +
        '</div>';
      }).join('') : '<div class="empty" style="padding:16px 0">这个月还没有支出</div>'}
    </div>
  </div>

  <div class="card flat mt qbar">
    <span class="qt">⚡ 常用</span>
    <div class="qchips">
      ${quick.length ? quick.map(q =>
        '<span class="qchip' + (q.in ? ' in' : '') + '" data-act="mo.quick" data-t="' + esc(q.t) + '" data-cat="' + esc(q.cat) + '" data-amt="' + Number(q.amt || 0) + '" data-inc="' + (q.in ? 1 : 0) + '" title="一点即记到今天">' +
          esc(q.t) + ' <b>' + (q.in ? '+' : '') + '¥' + num(q.amt) + '</b>' +
          '<i class="qx" data-act="mo.quickDel" data-t="' + esc(q.t) + '" title="从常用里移除">✕</i>' +
        '</span>').join('')
        : '<span class="qempty">还没有常用。用「＋ 记一笔」记过几次，常记的会自动出现在这里。</span>'}
      <button class="btn sm" data-act="mo.add" style="border-style:dashed;color:var(--muted-2)">＋ 自定义</button>
    </div>
    <span class="qhint">${quick.length ? '点一下即记今天 · 悬停可移除' : ''}</span>
  </div>

  <div class="card mt">
    <div class="card-hd"><h2><span class="ci">📒</span>明细</h2><span class="more">${recs.length} 笔</span></div>
    ${days.length ? days.map(d => {
      const items = byDay[d];
      const dayOut = items.filter(r => !r.in).reduce((a, r) => a + Number(r.amt || 0), 0);
      return '<div class="daygroup">' +
        '<div class="dhd"><span>' + mdText(d) + ' ' + WEEK[parseKey(d).getDay()] + '</span><b>' + (dayOut ? '-¥' + num(dayOut) : '') + '</b></div>' +
        items.map(r => {
          const real = DB.money.records.indexOf(r);
          return '<div class="mrow ' + (r.in ? 'in' : '') + '">' +
            '<div class="mt">' + esc(r.t) + ' <span class="cat">' + esc(r.cat) + '</span></div>' +
            '<div class="ma">' + (r.in ? '+' : '-') + '¥' + num(r.amt) + '</div>' +
            '<span class="edt" data-act="mo.edit" data-i="' + real + '">✎</span>' +
            '<span class="del" data-act="mo.del" data-i="' + real + '">✕</span></div>';
        }).join('') + '</div>';
    }).join('') : '<div class="empty">这个月还没记过账</div>'}
  </div>`;
};

/* ---------- 年视图：12 个月 + 预算参照线 ---------- */
function moneyYear(yk){
  const ys = yStats(yk);
  const budget = Number(DB.money.budget) || 0;
  const active = ys.active;
  const avg = active.length ? ys.spend / active.length : 0;
  const overM = ys.months.filter(m => budget && m.spend > budget);
  const cats = Object.keys(ys.byCat).sort((a, b) => ys.byCat[b] - ys.byCat[a]);
  const maxCat = Math.max.apply(null, cats.map(c => ys.byCat[c]).concat([1]));
  const mx = Math.max.apply(null, ys.months.map(m => m.spend).concat([budget, 1])) * 1.05;
  const budPct = budget ? (budget / mx * 100) : 0;
  const curY = monthKey().slice(0, 4), curM = monthKey();
  const totalCnt = ys.months.reduce((a, m) => a + m.count, 0);

  const head = `
  <div class="toolbar">
    <button class="btn sm o" data-act="yk.shift" data-v="-1">‹</button>
    <b style="font-size:13px;font-weight:600;margin:0 4px">${yk} 年</b>
    <button class="btn sm o" data-act="yk.shift" data-v="1">›</button>
    ${yk === curY ? '' : '<button class="btn sm g" data-act="yk.now">回到今年</button>'}
    <span class="grow"></span>
    ${seg('mv', [{v:'month', t:'月'}, {v:'year', t:'年'}], 'month')}
    <button class="btn sm o" data-act="mo.budget">预算 ${num(budget)}</button>
    <button class="btn sm p" data-act="mo.add">＋ 记一笔</button>
  </div>`;

  if (!active.length){
    return head + `
  <div class="card"><div class="empty" style="padding:46px 12px;line-height:2.1">
    ${yk} 年还没有记账<br>
    <button class="btn sm p" style="margin-top:10px" data-act="mo.add">＋ 记一笔</button>
  </div></div>`;
  }

  return head + `
  <div class="card">
    <div class="ykpi">
      <div><small>总支出</small><b>¥${num(ys.spend)}</b></div>
      <div><small>总收入</small><b style="color:var(--g)">¥${num(ys.income)}</b></div>
      <div><small>结余</small><b style="color:${ys.net < 0 ? 'var(--warm)' : 'var(--ink)'}">${ys.net < 0 ? '-' : ''}¥${num(Math.abs(ys.net))}</b></div>
      <div><small>平均每月</small><b>¥${num(avg)}</b></div>
    </div>
    <div style="margin-top:15px;padding-top:13px;border-top:1px solid var(--line-2);font-size:11.5px;color:var(--muted);line-height:1.9">
      有记录的 <b style="color:var(--ink-2);font-weight:600">${active.length}</b> 个月，共
      <b style="color:var(--ink-2);font-weight:600">${totalCnt}</b> 笔。
      ${budget ? (overM.length
        ? '其中 <b style="color:var(--warm);font-weight:600">' + overM.length + '</b> 个月超过预算 ¥' + num(budget) + '。'
        : '每个月都在预算内 👍') : ''}
    </div>
  </div>

  <div class="card mt">
    <div class="card-hd"><h2><span class="ci">📈</span>每月支出</h2><span class="more">点柱子进入那个月</span></div>
    <div class="y12">
      <div class="y12plot">
        ${budget ? '<div class="ybud" style="bottom:' + budPct.toFixed(2) + '%"><span>预算 ' + num(budget) + '</span></div>' : ''}
        <div class="y12bars">
          ${ys.months.map(m => {
            const base = budget ? Math.min(m.spend, budget) : m.spend;
            const over = budget ? Math.max(0, m.spend - budget) : 0;
            const e = m.count === 0;
            return '<div class="yb' + (e ? ' empty' : '') + '" data-act="mk.goto" data-mk="' + m.mk + '" title="' + esc(monthLabel(m.mk)) + ' · ¥' + num(m.spend) + '">' +
              (over ? '<div class="ybo" style="height:' + (over / mx * 100).toFixed(2) + '%"></div>' : '') +
              '<div class="ybb" style="height:' + (e ? 1 : Math.max(1, base / mx * 100)).toFixed(2) + '%"></div>' +
            '</div>';
          }).join('')}
        </div>
      </div>
      <div class="y12ax">
        ${ys.months.map(m => '<span class="' + (m.mk === curM ? 'on' : '') + '">' + Number(m.mk.slice(5)) + '</span>').join('')}
      </div>
    </div>
    <div style="margin-top:11px;font-size:10.5px;color:var(--muted-2);display:flex;gap:16px;flex-wrap:wrap">
      <span><i style="display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--g-l);margin-right:5px"></i>预算内</span>
      <span><i style="display:inline-block;width:7px;height:7px;border-radius:2px;background:var(--gold);margin-right:5px"></i>超出预算的部分</span>
    </div>
  </div>

  <div class="card mt">
    <div class="card-hd"><h2><span class="ci">📊</span>全年花在哪</h2><span class="more">${cats.length} 个分类</span></div>
    ${cats.map(c => {
      const v = ys.byCat[c], share = Math.round(v / Math.max(ys.spend, 1) * 100);
      return '<div class="ycat">' +
        '<span class="ycn">' + esc(c) + '</span>' +
        '<div class="ycb"><i style="width:' + (v / maxCat * 100).toFixed(1) + '%;background:' + (MC[c] || '#93a3ab') + '"></i></div>' +
        '<span class="ycv">¥' + num(v) + '</span>' +
        '<span class="ycp">' + share + '%</span>' +
      '</div>';
    }).join('')}
  </div>

  <div class="card mt">
    <div class="card-hd"><h2><span class="ci">📒</span>逐月账单</h2><span class="more">点一行进入那个月</span></div>
    ${active.map(m => {
      const diff = budget - m.spend;
      return '<div class="m2" data-act="mk.goto" data-mk="' + m.mk + '">' +
        '<b class="m2m">' + Number(m.mk.slice(5)) + ' 月</b>' +
        '<span class="m2v">¥' + num(m.spend) + '</span>' +
        '<span class="m2v in">' + (m.income ? '+¥' + num(m.income) : '') + '</span>' +
        '<span class="m2c">' + m.count + ' 笔</span>' +
        '<span class="m2d">' + (budget ? (diff >= 0 ? '省 ¥' + num(diff) : '<span style="color:var(--warm)">超 ¥' + num(-diff) + '</span>') : '') + '</span>' +
        '<span class="m2a">›</span>' +
      '</div>';
    }).join('')}
  </div>`;
}

/* ============================================================
   9. 习惯打卡
   ============================================================ */
V.habits = function(){
  const days7 = [];
  for (let i = 6; i >= 0; i--) days7.push(off(-i));
  const perDay = days7.map(k => habitDoneCount(k));
  const today = habitOf(todayKey());
  const doneToday = DB.habits.filter(h => (today[h.k] || 0) >= h.goal).length;
  let streak = 0;
  for (let i = 0; i < 90; i++){ if (habitDoneCount(off(-i)) >= 3) streak++; else if (i > 0) break; }
  const pct = DB.habits.length ? Math.round(DB.habits.reduce((a, h) => a + clamp((today[h.k] || 0) / h.goal, 0, 1), 0) / DB.habits.length * 100) : 0;

  return `
  <div class="card">
    <div class="card-hd"><h2><span class="ci">🌱</span>今天</h2>
      <span class="more"><span data-act="hb.add" style="cursor:pointer">＋ 加习惯</span> <span style="color:var(--line);margin:0 5px">|</span> <span data-act="hb.reset" style="cursor:pointer">重置今天</span></span></div>
    <div style="display:flex;align-items:center;gap:26px;flex-wrap:wrap">
      ${ring(pct, 96, 7, '<b>' + doneToday + '/' + DB.habits.length + '</b><small>今日完成</small>')}
      <div style="flex:1;min-width:230px">
        <div class="habits">
          ${DB.habits.map((h, i) => {
            const c = today[h.k] || 0, pp = clamp(Math.round(c / h.goal * 100), 0, 100);
            return '<div class="habit ' + (pp >= 100 ? 'on' : '') + '" data-act="hb.inc" data-k="' + esc(h.k) + '">' +
              '<div class="hb">' + ring(pp, 46, 4, false) + '<div class="em">' + h.i + '</div></div>' +
              '<div class="hn">' + c + '/' + h.goal + '</div><div class="hl">' + esc(h.k) + '</div></div>';
          }).join('')}
        </div>
        <div style="color:var(--muted-2);font-size:10.5px;margin-top:9px;text-align:center">
          点一下打卡｜<span data-act="hb.manage" style="cursor:pointer;color:var(--g)">管理习惯与目标</span>
        </div>
      </div>
    </div>
  </div>

  <div class="card mt">
    <div class="card-hd"><h2><span class="ci">📊</span>最近 7 天</h2><span class="more">连续达标 ${streak} 天</span></div>
    ${bars(perDay, days7.map(k => WEEK[parseKey(k).getDay()]), '')}
  </div>

  <div class="card mt">
    <div class="card-hd"><h2><span class="ci">🗓️</span>补打卡</h2><span class="more">忘了也能补，点格子加一次</span></div>
    <div style="overflow-x:auto">
      <table style="width:100%;border-collapse:collapse;font-size:11px">
        <tr>
          <th style="text-align:left;padding:6px 4px;color:var(--muted-2);font-weight:400;white-space:nowrap;width:88px">习惯</th>
          ${days7.map(k => '<th style="padding:6px 2px;color:var(--muted-2);font-weight:400;white-space:nowrap">' +
            WEEK[parseKey(k).getDay()].replace('周','') + '<br><span style="font-size:9px;opacity:.75">' + Number(k.slice(8)) + '</span></th>').join('')}
        </tr>
        ${DB.habits.map(h => '<tr>' +
          '<td style="padding:5px 4px;white-space:nowrap;color:var(--ink-2);width:88px">' + h.i + ' ' + esc(h.k) + '</td>' +
          days7.map(k => {
            const c = (DB.habitLog[k] || {})[h.k] || 0;
            const ok = c >= h.goal;
            return '<td style="text-align:center;padding:3px 2px">' +
              '<span data-act="hb.cell" data-k="' + esc(h.k) + '" data-d="' + k + '" ' +
              'style="display:inline-flex;align-items:center;justify-content:center;width:26px;height:22px;border-radius:5px;cursor:pointer;font-variant-numeric:tabular-nums;font-size:10px;' +
              'background:' + (ok ? 'var(--g-bg)' : (c ? 'var(--gold-bg)' : 'var(--line-2)')) + ';color:' + (ok ? 'var(--g-d)' : (c ? 'var(--gold)' : 'var(--muted-2)')) + '">' +
              (c || '·') + '</span></td>';
          }).join('') + '</tr>').join('')}
      </table>
    </div>
  </div>`;
};
