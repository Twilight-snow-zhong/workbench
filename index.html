/* ============================================================
   13. 周复盘
   ============================================================ */
V.review = function(){
  const off = STATE.q.rvOff || 0;
  const ws = shiftDay(weekStart(), off * 7);
  const we = shiftDay(ws, 6);
  const inW = k => k >= ws && k <= we;
  const isNow = off === 0;

  const doneList = [];
  DB.inbox.forEach(x => { if (x.done && x.doneAt && inW(x.doneAt)) doneList.push(x.t); });
  DB.courses.forEach(c => (c.tasks || []).forEach(x => { if (x.done && x.doneAt && inW(x.doneAt)) doneList.push(c.name + ' · ' + x.t); }));
  DB.repeat.forEach(r => { if (r.last && inW(r.last)) doneList.push(r.t); });

  const spend = DB.money.records.filter(r => inW(r.d) && !r.in).reduce((a, r) => a + Number(r.amt || 0), 0);
  let okDays = 0;
  for (let i = 0; i < 7; i++){ const k = shiftDay(ws, i); if (k > todayKey()) break; if (habitDoneCount(k) >= 3) okDays++; }
  const overdue = buckets().over;

  return `
  <div class="toolbar">
    <button class="btn sm o" data-act="rv.shift" data-v="-1">‹</button>
    <b style="font-size:13px;font-weight:600;margin:0 4px">${mdText(ws)} — ${mdText(we)}</b>
    <button class="btn sm o" data-act="rv.shift" data-v="1">›</button>
    ${isNow ? '<span class="cat">本周</span>' : '<button class="btn sm g" data-act="rv.shift" data-v="0">回到本周</button>'}
  </div>

  <div class="stats g4">
    <div class="stat"><div class="si">✓</div><div><b>${doneList.length}</b><span>完成的事</span></div></div>
    <div class="stat"><div class="si">⚠️</div><div><b>${overdue.length}</b><span>还逾期着</span></div></div>
    <div class="stat"><div class="si">¥</div><div><b>${num(spend)}</b><span>花了</span></div></div>
    <div class="stat"><div class="si">🌱</div><div><b>${okDays} 天</b><span>习惯达标</span></div></div>
  </div>

  <div class="grid g2e mt">
    <div class="card">
      <div class="card-hd"><h2><span class="ci">🏆</span>做完了</h2><span class="more">${doneList.length} 件</span></div>
      ${doneList.length ? '<div>' + doneList.map(t => '<div class="tk"><div class="sqc on">✓</div><div class="tt"><b>' + esc(t) + '</b></div></div>').join('') + '</div>'
        : '<div class="empty">这周还没有勾掉的事</div>'}
    </div>
    <div class="card">
      <div class="card-hd"><h2><span class="ci">🐢</span>拖着没做的</h2>
        <span class="more" data-act="go" data-k="inbox">去处理 →</span></div>
      ${overdue.length ? taskList(overdue, {edit:'tk.edit'}) : '<div class="empty">没有逾期的事 👍</div>'}
    </div>
  </div>

  <div class="card mt">
    <div class="card-hd"><h2><span class="ci">✎</span>这周的想法</h2>
      <span class="more" data-act="rv.note">编辑</span></div>
    <div class="note" style="font-size:12.5px">${esc(DB.review.note) || '<span style="color:var(--muted-2)">还没写</span>'}</div>
  </div>

  <div class="card mt">
    <div class="card-hd"><h2><span class="ci">✔</span>下周想改的事</h2>
      <span class="more" data-act="rv.add">＋ 加一条</span></div>
    <div>
      ${DB.review.actions.map((a, i) => '<div class="tk ' + (a.done ? 'done' : '') + '">' +
        '<div class="sqc ' + (a.done ? 'on' : '') + '" data-act="rv.action" data-i="' + i + '">' + (a.done ? '✓' : '') + '</div>' +
        '<div class="tt"><b>' + esc(a.t) + '</b></div>' +
        '<span class="del" data-act="rv.del" data-i="' + i + '">✕</span></div>').join('') || '<div class="empty">还没有想改的事</div>'}
    </div>
  </div>`;
};


/* ==================================================================
   应用层：路由 / 动作 / 事件 / 启动
   ================================================================== */

/* ---------------- 路由与渲染 ---------------- */
function currentNav(){ return NAV.filter(n => n.k === STATE.tab)[0] || NAV[0]; }

function kickFor(k){
  const w = weekNo(todayKey());
  switch (k){
    case 'home':     return '学习 · 生活 · 一点点秩序';
    case 'inbox':    return '收集 · 排期 · 完成';
    case 'schedule': return '第 ' + w + ' 周 · ' + parityText(w);
    case 'courses':  return '这学期 ' + DB.courses.length + ' 门课';
    case 'goals':    return '倒计时 · 目标';
    case 'repeat':   return '每周 · 每月';
    case 'money':    return monthLabel(STATE.q.mk || monthKey());
    case 'shop':     return (DB.shop.filter(s => !s.done).length) + ' 件待买';
    case 'habits':   return '今天 · 连续 ' + (
      (function(){ let s = 0; for (let i = 0; i < 90; i++){ if (habitDoneCount(off(-i)) >= 3) s++; else if (i > 0) break; } return s; })()
    ) + ' 天';
    case 'notes':    return DB.notes.length + ' 条笔记 · ' + DB.files.length + ' 份资料';
    case 'prep':     return DB.prep.length + ' 张清单';
    case 'books':    return '在读 · ' + (DB.books.current.pct || 0) + '%';
    case 'review':   return '回头看一周';
  }
  return '';
}
function navLink(n){
  return '<a data-act="go" data-k="' + n.k + '" class="' + (STATE.tab === n.k ? 'on' : '') + '">' +
    '<span class="ni">' + navIcon(n.k) + '</span>' + esc(n.t) + '</a>';
}
function renderNav(){
  const main = NAV.filter(n => !n.rare);
  const rare = NAV.filter(n => n.rare);
  const rareActive = rare.some(n => n.k === STATE.tab);
  const open = (STATE.more == null) ? rareActive : !!STATE.more;
  $('#nav').innerHTML = main.map(navLink).join('') +
    (rare.length ? '<div class="navmore' + (open ? ' open' : '') + '">' +
      '<button class="navtoggle" data-act="nav.more" title="收起 / 展开">' +
        '<span class="chev"><svg viewBox="0 0 16 16" width="9" height="9" fill="none" stroke="currentColor" ' +
          'stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3.5 10.5 8 6 12.5"/></svg></span>' +
        '<span class="nl">更多</span><em>' + rare.length + '</em>' +
      '</button>' +
      '<div class="navsub">' + rare.map(navLink).join('') + '</div>' +
    '</div>' : '');
}
function render(keepScroll){
  const n = currentNav();
  $('#ttl-t').textContent = n.t;
  $('#sub').textContent = n.sub;
  $('#kick').textContent = kickFor(n.k);
  $('#dtext').innerHTML = '<b>' + dateText(todayKey()) + '</b>';
  $('#footnote').innerHTML = '数据保存在本机浏览器<br>' + (function(){
    const b = buckets();
    return b.over.length ? '⚠ ' + b.over.length + ' 件逾期 · ' + b.today.length + ' 件今天' : (b.today.length ? b.today.length + ' 件今天到期' : '暂无到期');
  })();
  renderNav();
  const y = window.scrollY;
  $('#view').innerHTML = V[STATE.tab]();
  if (keepScroll) window.scrollTo(0, y); else window.scrollTo(0, 0);
  if (location.hash.slice(1) !== STATE.tab) history.replaceState(null, '', '#' + STATE.tab);
  /* 恢复焦点（搜索框） */
  if (STATE.focus){
    const f = $(STATE.focus.sel);
    if (f){ f.focus(); if (STATE.focus.pos != null && f.setSelectionRange) try { f.setSelectionRange(STATE.focus.pos, STATE.focus.pos); } catch (e) {} }
    STATE.focus = null;
  }
}
function go(k, keep){
  if (!V[k]) return;
  STATE.tab = k; closeDrawer(); render(keep);
}
function closeDrawer(){ $('#side').classList.remove('open'); $('#scrim').classList.remove('on'); }
function val(sel){ const e = $(sel); return e ? String(e.value == null ? '' : e.value).trim() : ''; }
function numVal(sel){ return Number(val(sel) || 0); }

/* ---------------- 表单：课表 / 日程 / 课程 / 目标 / 重复 / 记账 ---------------- */
function clsForm(item, day){
  const isNew = !item;
  const spec = [
    {k:'t', label:'课程', value: item ? item.t : '', required:true, ph:'例如：数据结构'},
    {k:'p', label:'节次 / 时间', value: item ? item.p : '1-2', hint:'写 1-2 或 5-7；也可以直接写时间 15:00-16:00'},
    {k:'room', label:'教室', value: item ? item.room : '', ph:'例如：教1-101'},
    {k:'teacher', label:'老师', value: item ? item.teacher : ''},
    {k:'wv', label:'教学周', value: item ? weeksToStr(item.weeks) : '1-16', hint:'写法：1-16 或 1-3,5-7'},
    {k:'parity', label:'单双周', type:'select', value: item ? (item.parity || 'all') : 'all',
      opts:[{v:'all',t:'每周'},{v:'odd',t:'单周'},{v:'even',t:'双周'}]},
    {k:'day', label:'星期', type:'select', value: day, opts:[1,2,3,4,5,6,7].map(d => ({v:d, t:weekdayCN(d)}))},
    {k:'note', label:'备注（可选）', value: item ? (item.note || '') : '', ph:'例如：双周 / 辅修'},
    {k:'c', label:'颜色', type:'select', value: item ? item.c : CLS_COLORS[0], opts: CLS_COLORS.map((x, i) => ({v:x, t:'颜色 ' + (i+1)}))}
  ];
  form(isNew ? '加一节课' : '改这节课', spec, v => {
    pushUndo();
    const nd = Number(v.day);
    const dayObj = DB.schedule.filter(s => s.d === nd)[0];
    const obj = item || {id:uid()};
    obj.t = v.t; obj.p = v.p || '1-2'; obj.room = v.room; obj.teacher = v.teacher;
    obj.weeks = parseWeeks(v.wv); obj.parity = v.parity; obj.note = v.note; obj.c = v.c;
    /* 改课：先从所有天里摘掉旧的，再放进新的一天（避免重复插入） */
    if (item) DB.schedule.forEach(s => { s.items = (s.items || []).filter(x => x.id !== obj.id); });
    dayObj.items.push(obj);
    dayObj.items.sort((a, b) => pMin(a.p) - pMin(b.p));
    commit(isNew ? '已加上' : '已更新');
  }, { okText: isNew ? '加上' : '保存' });
  /* 编辑时提供删除 */
  if (!isNew){
    const foot = $('#modal .mfoot');
    if (foot){
      const b = document.createElement('button');
      b.className = 'btn danger'; b.textContent = '删除这节课';
      b.onclick = () => {
        closeModal();
        confirmBox('删掉这一节「' + esc(item.t) + '」？', () => {
          pushUndo();
          DB.schedule.forEach(s => { s.items = s.items.filter(x => x.id !== item.id); });
          commit('已删除');
        }, '删除');
      };
      foot.insertBefore(b, foot.firstChild);
    }
  }
}

function moneyForm(i){
  const r = (i == null) ? null : DB.money.records[i];
  const isNew = !r;
  form(isNew ? '记一笔' : '改这一笔', [
    {k:'t', label:'花在哪（或收入来源）', value: r ? r.t : '', required:true, ph:'例如：食堂午饭'},
    {k:'amt', label:'金额', type:'number', value: r ? r.amt : '', min:0, step:'0.01', required:true},
    {k:'cat', label:'分类', type:'select', value: r ? r.cat : '吃饭', opts:['吃饭','交通','学习','日用','娱乐','话费','水电费','医疗','人情','其他']},
    {k:'d', label:'日期', type:'date', value: r ? r.d : todayKey()},
    {k:'in', label:'这是收入（不是支出）', type:'check', value: r ? !!r.in : false}
  ], v => {
    pushUndo();
    if (isNew){
      DB.money.records.unshift({id:uid(), d:v.d, t:v.t, cat:v.cat, amt:Number(v.amt), in:!!v.in});
      /* 记住最近 6 条常用（连"是不是收入"一起存，否则点它会被记成支出） */
      const q = (DB.money.quick || []).filter(x => x.t !== v.t);
      q.unshift({ t:v.t, cat:v.cat, amt:Number(v.amt), in:!!v.in });
      DB.money.quick = q.slice(0, 6);
    } else {
      const oldT = r.t;
      r.t = v.t; r.amt = Number(v.amt); r.cat = v.cat; r.d = v.d; r.in = !!v.in;
      /* 改记录时，常用里同名那条顺手同步，免得 chip 上还是旧金额 */
      const hit = (DB.money.quick || []).filter(x => x.t === oldT)[0];
      if (hit){ hit.t = v.t; hit.cat = v.cat; hit.amt = Number(v.amt); hit.in = !!v.in; }
    }
    commit(isNew ? '记上了' : '已更新');
  }, { okText: isNew ? '记上' : '保存' });
}
function incHabit(k, d, el){
  const h = DB.habits.filter(v => v.k === k)[0]; if (!h) return;
  pushUndo();
  const log = habitOf(d), c = (log[k] || 0) + 1;
  log[k] = c > h.goal ? 0 : c;
  saveDB(); render(true);
  if (log[k] >= h.goal) toast('「' + k + '」达标 ✅');
}

/* ---------------- 事件 ---------------- */
document.addEventListener('click', function(e){
  const el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) return;
  const fn = ACT[el.getAttribute('data-act')];
  if (fn){ e.preventDefault(); fn(el, e); }
});
document.addEventListener('change', function(e){
  const el = e.target;
  if (el.dataset && el.dataset.sel){
    STATE.q[el.dataset.sel] = el.value; render(true);
  }
});
document.addEventListener('input', function(e){
  const el = e.target;
  if (el.dataset && el.dataset.search){
    STATE.q[el.dataset.search] = el.value;
    STATE.focus = { sel: '#s_' + el.dataset.search, pos: el.selectionStart };
    render(true);
  }
});
document.addEventListener('keydown', function(e){
  if (e.key === 'Enter' && e.target && e.target.getAttribute && e.target.getAttribute('data-enter')){
    const fn = ACT[e.target.getAttribute('data-enter')];
    if (fn){ e.preventDefault(); fn(e.target, e); }
    return;
  }
  if (e.key === 'Escape'){ closeModal(); closeDrawer(); }
  /* Ctrl/⌘ + Z 撤销 */
  if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === 'z' && !/^(INPUT|TEXTAREA|SELECT)$/.test((e.target.tagName || ''))){
    e.preventDefault(); undoLast();
  }
  /* Ctrl/⌘ + K 快速记录 */
  if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === 'k'){
    e.preventDefault();
    const q = $('#qtext');
    if (q) q.focus(); else { go('inbox'); setTimeout(() => { const x = $('#qtext'); if (x) x.focus(); }, 80); }
  }
});
window.addEventListener('hashchange', function(){
  const k = location.hash.slice(1);
  if (V[k] && k !== STATE.tab) go(k);
});

/* ---------------- 启动 ---------------- */
(function boot(){
  DB = loadDB();
  fixTimetable();
  fixOct18();
  if (!DB.money.quick) DB.money.quick = [];
  if (!DB.extra) DB.extra = [];
  /* 旧数据的课表条目没有 id（旧版 seed 没写），新版靠 id 定位，这里补上 */
  (DB.schedule || []).forEach(s => (s.items || []).forEach(c => { if (!c.id) c.id = uid(); }));
  dailySnap();
  DB.scene = applyScene(DB.scene || 0);
  saveDB();
  injectDefs();
  const h = location.hash.slice(1);
  if (V[h]) STATE.tab = h;
  render();
})();

</script>
